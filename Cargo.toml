[package]
name = "bankai-fast-mcs"
version = "0.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
numpy = "0.29"
pyo3 = "0.29"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "setup_smoke"
harness = false
