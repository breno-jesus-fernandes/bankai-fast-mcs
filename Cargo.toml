[package]
name = "bankai-fast-mcs"
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"
description = "Rust core and PyO3 bindings for bankai-fast-mcs."
repository = "https://github.com/breno-jesus-fernandes/bankai-fast-mcs"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
ndarray = "0.17"
numpy = "0.29"
pyo3 = "0.29"
rayon = "1.11"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "setup_smoke"
harness = false
