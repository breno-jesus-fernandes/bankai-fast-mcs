name: Bug report
description: Report a reproducible problem with Bankai Fast MCS.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting process in [SECURITY.md](https://github.com/breno-jesus-fernandes/bankai-fast-mcs/blob/main/.github/SECURITY.md). Do not report vulnerabilities in public issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include a minimal Python example or command that reproduces the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Bankai Fast MCS version, Python version, operating system, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback or logs
      description: Add relevant output, removing secrets and private data.
    validations:
      required: false
