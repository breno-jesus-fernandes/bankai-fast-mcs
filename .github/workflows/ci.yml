name: CI and release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_gate:
    name: Verify PyPI release version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and check PyPI
        id: version
        run: |
          current_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${current_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match project version ${expected_tag}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/bankai-fast-mcs/${current_version}/json")"
          if [[ "${status}" == "404" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "${current_version} is not yet published on PyPI."
          elif [[ "${status}" == "200" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "${current_version} is already published on PyPI."
          else
            echo "::error::Could not verify PyPI release state (HTTP ${status})."
            exit 1
          fi

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      TEST_PYTHON_VERSION: "3.11"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: Windows x86_64
            runner: windows-2025
          - name: Windows ARM64
            runner: windows-11-arm
            python-architecture: arm64
          - name: macOS x86_64
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python with uv
        if: matrix.runner != 'windows-11-arm' && matrix.runner != 'windows-2025'
        run: uv python install "${{ env.TEST_PYTHON_VERSION }}"

      - name: Install native x86_64 Python on Windows x86_64
        if: matrix.runner == 'windows-2025'
        id: x64_python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.TEST_PYTHON_VERSION }}
          architecture: x64

      - name: Install native ARM64 Python on Windows ARM64
        if: matrix.runner == 'windows-11-arm'
        id: arm_python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ env.TEST_PYTHON_VERSION }}
          architecture: arm64

      - name: Install project and test dependencies
        if: matrix.runner != 'windows-11-arm' && matrix.runner != 'windows-2025'
        run: uv sync --python "${{ env.TEST_PYTHON_VERSION }}" --locked --extra dev --no-install-project

      - name: Install project and test dependencies with native x86_64 Python
        if: matrix.runner == 'windows-2025'
        run: uv sync --python "${{ steps.x64_python.outputs.python-path }}" --locked --extra dev --no-install-project

      - name: Install project and test dependencies with native ARM64 Python
        if: matrix.runner == 'windows-11-arm'
        run: uv sync --python "${{ steps.arm_python.outputs.python-path }}" --locked --extra dev --no-install-project

      - name: Add uv Python shared library to runtime path
        if: matrix.runner == 'ubuntu-24.04' || matrix.runner == 'ubuntu-24.04-arm'
        run: echo "LD_LIBRARY_PATH=$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install the native extension
        run: uv run --no-sync maturin develop --release --locked

      - name: Run Python tests
        run: uv run --no-sync pytest -q

      - name: Run Rust tests
        run: uv run --no-sync cargo test --locked

  coverage:
    name: Coverage (Python and Rust)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Rust coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and coverage dependencies
        run: uv sync --python 3.11 --locked --extra dev --no-install-project

      - name: Add uv Python shared library to runtime path
        run: echo "LD_LIBRARY_PATH=$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install the native extension
        run: uv run --no-sync maturin develop --release --locked

      - name: Run Python tests with coverage
        run: uv run --no-sync pytest -q --cov=bankai_fast_mcs --cov-report=xml:coverage-python.xml

      - name: Run Rust tests with coverage
        run: uv run --no-sync cargo llvm-cov --lcov --output-path coverage-rust.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-python.xml,coverage-rust.lcov
          fail_ci_if_error: false

  wheels:
    name: Build wheel (${{ matrix.platform.name }}, Python ${{ matrix.python-version }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            architecture: x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            architecture: arm64
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            architecture: x64
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
            architecture: arm64
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
            architecture: x64
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
            architecture: arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for native platform build
        if: matrix.platform.manylinux == 'off'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.architecture }}

      - name: Build manylinux wheel
        if: matrix.platform.manylinux != 'off'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          maturin-version: v1.15.0
          args: --release --locked --out dist -i python${{ matrix.python-version }}

      - name: Build native platform wheel
        if: matrix.platform.manylinux == 'off'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          maturin-version: v1.15.0
          args: --release --locked --out dist -i python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Build source distribution
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  distributions:
    name: Collect release artifacts and SBOMs
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21

      - name: Install SBOM generators
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust and Python CycloneDX SBOMs
        run: |
          mkdir -p dist/packages
          mv dist/*.whl dist/*.tar.gz dist/packages/
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo cyclonedx --manifest-path Cargo.toml --format json --override-filename rust-sbom
          mv rust-sbom.json dist/bankai-fast-mcs-rust.cdx.json
          uv export --locked --no-emit-project --format requirements-txt --output-file dist/requirements-sbom.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements dist/requirements-sbom.txt --of JSON -o dist/bankai-fast-mcs-python.cdx.json --no-validate
          rm dist/requirements-sbom.txt

      - name: Upload complete release artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bankai-fast-mcs-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release artifacts
    needs: distributions
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bankai-fast-mcs-release
          path: dist

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

  publish:
    name: Publish release to PyPI
    needs: [release_gate, distributions, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release_gate.outputs.changed == 'true'
    concurrency:
      group: publish-${{ needs.release_gate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/bankai-fast-mcs/${{ needs.release_gate.outputs.version }}/
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bankai-fast-mcs-release
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/

  github_release:
    name: Create GitHub release
    needs: [release_gate, publish]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.release_gate.outputs.version != '' &&
      ((needs.release_gate.outputs.changed == 'true' && needs.publish.result == 'success') ||
      (needs.release_gate.outputs.changed == 'false' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bankai-fast-mcs-release
          path: dist

      - name: Create GitHub release with distributions and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_gate.outputs.version }}
        run: |
          tag="v${VERSION}"
          release_args=(--repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes --target "$GITHUB_SHA")
          if [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/packages/* dist/*.cdx.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/packages/* dist/*.cdx.json "${release_args[@]}"
          fi
